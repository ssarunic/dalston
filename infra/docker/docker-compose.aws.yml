# Docker Compose override for AWS deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f infra/docker/docker-compose.aws.yml up -d --profile local-infra --profile gpu

x-aws-s3: &aws-s3
  DALSTON_S3_BUCKET: ${DALSTON_S3_BUCKET}
  DALSTON_S3_REGION: ${DALSTON_S3_REGION}
  DALSTON_S3_ENDPOINT_URL: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: ${AWS_REGION}

services:
  # Disable MinIO — using real S3 on AWS
  minio:
    profiles: [disabled]
  minio-init:
    profiles: [disabled]

  gateway:
    environment:
      <<: *aws-s3
      DALSTON_S3_PUBLIC_ENDPOINT_URL: ${DALSTON_S3_PUBLIC_ENDPOINT_URL:-}
    # Loopback binding for `tailscale serve` (which proxies to localhost).
    # Direct tailnet access comes from the base mapping, which binds the
    # Tailscale IP via DALSTON_BIND_IP (written to .env.aws at boot).
    ports:
      - "127.0.0.1:8000:8000"
      # In-VPC path for the "thestill" app (spec #66), which reaches the
      # gateway over the VPC rather than the tailnet. Ingress is granted
      # security-group-to-security-group on 8000 with no CIDR ranges, so
      # this never widens exposure beyond that one peer group — and never
      # reaches the public ENI.
      #
      # Defaults to 127.0.0.2 (loopback) so deployments that do not set
      # DALSTON_VPC_IP bind nothing new. Set it to the instance's private
      # IP in .env.aws to enable the path.
      - "${DALSTON_VPC_IP:-127.0.0.2}:8000:8000"

  orchestrator:
    environment:
      <<: *aws-s3

  postgres:
    volumes:
      - /data/postgres:/var/lib/postgresql

  redis:
    volumes:
      - /data/redis:/data
    # Loopback binding for host-local consumers (the M91 autoscaler tick
    # reads queue lag via redis://localhost:6379). Tailnet access for GPU
    # workers comes from the base mapping via DALSTON_BIND_IP.
    ports:
      - "127.0.0.1:6379:6379"

  stt-prepare:
    environment:
      <<: *aws-s3

  stt-transcribe-faster-whisper:
    environment:
      <<: *aws-s3
      HF_HOME: /data/models
    volumes:
      - /data/models:/data/models

  stt-transcribe-nemo:
    environment:
      <<: *aws-s3
      HF_HOME: /data/models
      NEMO_CACHE: /data/models
    volumes:
      - /data/models:/data/models

  stt-transcribe-onnx:
    environment:
      <<: *aws-s3
      HF_HOME: /data/models
    volumes:
      - /data/models:/data/models

  stt-align-phoneme:
    environment:
      <<: *aws-s3
      HF_HOME: /data/models
    volumes:
      - /data/models:/data/models

  stt-pii-detect-presidio:
    environment:
      <<: *aws-s3
      HF_HOME: /data/models
    volumes:
      - /data/models:/data/models

  stt-diarize-pyannote-4.0:
    environment:
      <<: *aws-s3
      HF_HOME: /data/models
    volumes:
      - /data/models:/data/models

  stt-diarize-nemo-msdd:
    environment:
      <<: *aws-s3
      NEMO_CACHE: /data/models
    volumes:
      - /data/models:/data/models

  # NeMo Sortformer diarization (GPU)
  stt-diarize-nemo-sortformer:
    environment:
      <<: *aws-s3
      NEMO_CACHE: /data/models
    volumes:
      - /data/models:/data/models

  # NeMo Sortformer diarization (CPU)
  stt-diarize-nemo-sortformer-cpu:
    environment:
      <<: *aws-s3
      NEMO_CACHE: /data/models
    volumes:
      - /data/models:/data/models


  # Prometheus can't resolve Tailscale hostnames from Docker's network.
  # GPU targets in gpu-targets.json use Tailscale IPs instead.
  prometheus:
    volumes:
      - /data/prometheus:/prometheus

# Exclude MinIO services - using S3 instead
# The base docker-compose.yml may define minio and minio-init
# but they won't be started unless explicitly included
