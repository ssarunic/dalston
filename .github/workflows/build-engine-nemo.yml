# .github/workflows/build-engine-nemo.yml
#
# Builds the NeMo Parakeet engine image and pushes to GHCR.
# Runs natively on x86 — no QEMU, no 40-minute builds.
#
# Triggers:
#   - Push to main that changes engine code or its Dockerfile
#   - Manual dispatch (for rebuilding without code changes, or to push a
#     side tag from a branch for GPU validation without touching :latest)
#
# Prerequisites (one-time setup):
#   - Repository must have packages write permission enabled for GitHub Actions

name: Build NeMo Engine

on:
  push:
    branches: [main]
    paths:
      - 'engines/stt-transcribe/nemo/**'
      - 'dalston/**'
      - 'pyproject.toml'
      - 'docker/Dockerfile.base-nemo'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Image tag to push INSTEAD of :latest (e.g. nemo3-rc1). Use this to
          build a branch for GPU validation without changing what production
          pulls. Leave empty to push :latest.
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/stt-transcribe-nemo

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # x86 native — no QEMU needed
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base-nemo and engine
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          # Build base-nemo first (engine depends on it)
          docker build \
            --build-arg DEVICE=cuda \
            -t dalston/base-nemo:latest \
            -f docker/Dockerfile.base-nemo \
            .

          # Build engine on top of base-nemo
          PRIMARY_TAG="${IMAGE_TAG:-latest}"
          TAGS="-t $REGISTRY/$IMAGE_NAME:$PRIMARY_TAG"
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="$TAGS -t $REGISTRY/$IMAGE_NAME:$VERSION"
          fi

          docker build \
            --build-arg DEVICE=cuda \
            $TAGS \
            -f engines/stt-transcribe/nemo/Dockerfile \
            .

          # Smoke test: verify the OTLP/telemetry stack imports in the built
          # image before publishing. The gRPC exporter import is where an
          # OpenTelemetry version skew crashes at runtime (see #256). CPU-only,
          # no GPU required — runs fine on the ubuntu-latest runner.
          echo "Smoke testing $REGISTRY/$IMAGE_NAME:$PRIMARY_TAG (telemetry import) ..."
          docker run --rm --entrypoint python "$REGISTRY/$IMAGE_NAME:$PRIMARY_TAG" -c \
            "import dalston.telemetry; from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter; print('telemetry import OK')"

          docker push "$REGISTRY/$IMAGE_NAME:$PRIMARY_TAG"
          if [[ -n "$VERSION" ]]; then
            docker push "$REGISTRY/$IMAGE_NAME:$VERSION"
          fi

          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`$REGISTRY/$IMAGE_NAME:$PRIMARY_TAG\`" >> $GITHUB_STEP_SUMMARY
          if [[ -n "$VERSION" ]]; then
            echo "- \`$REGISTRY/$IMAGE_NAME:$VERSION\`" >> $GITHUB_STEP_SUMMARY
          fi
