version: 2
updates:
  # Python dependencies (main server)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      # OpenTelemetry packages must move in lockstep — core 1.X.Y pins
      # opentelemetry-semantic-conventions==0.(X+21)bY, which every
      # instrumentation-* and test-utils package also pins. Splitting them
      # across PRs produces unsatisfiable resolves until all merge.
      opentelemetry:
        patterns:
          - "opentelemetry-*"
        update-types:
          - major
          - minor
          - patch
      minor-and-patch:
        update-types:
          - minor
          - patch
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - python

  # Python SDK
  - package-ecosystem: pip
    directory: "/sdk"
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - python

  # CLI
  - package-ecosystem: pip
    directory: "/cli"
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - python

  # Engine dependencies — one monthly PR across all engines. Merging anything
  # under engines/ rebuilds GHCR :latest, which GPU workers pull at boot, so
  # these are reviewed by hand (dependabot-auto-merge.yml skips /engines).
  # riva and vllm-asr stay separate: their ignore rules would wrongly block
  # protobuf/numpy updates in the other engines.
  - package-ecosystem: pip
    directories:
      - "/engines/stt-align/phoneme-align"
      - "/engines/stt-combo/whisper-align-pyannote"
      - "/engines/stt-detect/pii-presidio"
      - "/engines/stt-diarize/nemo-msdd"
      - "/engines/stt-diarize/nemo-sortformer"
      - "/engines/stt-diarize/pyannote-4.0"
      - "/engines/stt-merge/final-merger"
      - "/engines/stt-prepare/audio-prepare"
      - "/engines/stt-redact/audio-redactor"
      - "/engines/stt-transcribe/faster-whisper"
      - "/engines/stt-transcribe/hf-asr"
      - "/engines/stt-transcribe/hf-asr-align-pyannote"
      - "/engines/stt-transcribe/nemo"
      - "/engines/stt-transcribe/onnx"
    schedule:
      interval: monthly
    groups:
      engines:
        patterns:
          - "*"
    ignore:
      # silero-vad is pinned in lockstep across docker/Dockerfile.base-* and
      # engine requirements (tests/unit/test_silero_vad_shared.py). A
      # single-file bump always fails CI; bump it everywhere by hand.
      - dependency-name: "silero-vad"
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - python
      - engines

  - package-ecosystem: pip
    directory: "/engines/stt-transcribe/riva"
    schedule:
      interval: monthly
    groups:
      all:
        patterns:
          - "*"
    # nvidia-riva-client 2.25.1 (latest) pins protobuf==6.33.5 EXACTLY.
    # Any bump (even patch within 6.33.x) breaks resolution. Ignore all
    # protobuf updates until a newer riva-client ships.
    ignore:
      - dependency-name: "protobuf"
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - python
      - engines

  - package-ecosystem: pip
    directory: "/engines/stt-transcribe/vllm-asr"
    schedule:
      interval: monthly
    groups:
      all:
        patterns:
          - "*"
    # vllm[audio] 0.20.x requires numpy>=1.25,<2.4. Bumping numpy to 2.4+
    # is unsatisfiable until vllm releases a numpy-2.4-compatible build.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.4"]
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - python
      - engines

  # Web console (npm)
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - javascript

  # Root npm (Playwright)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - javascript

  # Docker base images (core services)
  # IMPORTANT: nvidia/cuda must stay on 12.x — ML libraries (PyTorch,
  # onnxruntime-gpu, CTranslate2) only ship CUDA 12 wheels.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "nvidia/cuda"
        update-types: ["version-update:semver-major"]
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - docker

  # Engine Dockerfiles — one monthly PR across all engines
  - package-ecosystem: docker
    directories:
      - "/engines/stt-align/phoneme-align"
      - "/engines/stt-combo/whisper-align-pyannote"
      - "/engines/stt-detect/pii-presidio"
      - "/engines/stt-diarize/nemo-msdd"
      - "/engines/stt-diarize/nemo-sortformer"
      - "/engines/stt-diarize/pyannote-4.0"
      - "/engines/stt-merge/final-merger"
      - "/engines/stt-prepare/audio-prepare"
      - "/engines/stt-redact/audio-redactor"
      - "/engines/stt-transcribe/faster-whisper"
      - "/engines/stt-transcribe/hf-asr"
      - "/engines/stt-transcribe/hf-asr-align-pyannote"
      - "/engines/stt-transcribe/nemo"
      - "/engines/stt-transcribe/onnx"
      - "/engines/stt-transcribe/riva"
      - "/engines/stt-transcribe/vllm-asr"
    schedule:
      interval: monthly
    groups:
      engine-images:
        patterns:
          - "*"
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - docker
      - engines

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    reviewers:
      - sasasarunic
    labels:
      - dependencies
      - ci
